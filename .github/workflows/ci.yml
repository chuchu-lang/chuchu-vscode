name: Extension CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Extension host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Extension host tests (macOS and Windows)
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Current stable VS Code (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: stable
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: chuchu-vscode-${{ matrix.os }}
          path: chuchu-vscode.vsix
